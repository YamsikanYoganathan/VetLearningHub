<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Defs for Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" /> <!-- sky-600 -->
      <stop offset="100%" stop-color="#0f766e" /> <!-- teal-700 -->
    </linearGradient>
    <linearGradient id="iconGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" /> <!-- sky-100 -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#bgGradient)" filter="url(#shadow)" />
  
  <!-- Outer Ring (Subtle) -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Medical Cross & Book Motif -->
  <g transform="translate(100, 100) scale(1.1)" fill="url(#iconGradient)">
    <!-- Book Base / Shield -->
    <path d="M -30 20 C -15 25, -5 20, 0 10 C 5 20, 15 25, 30 20 L 30 -25 C 15 -20, 5 -25, 0 -35 C -5 -25, -15 -20, -30 -25 Z" fill-opacity="0.2" />
    
    <!-- Medical Cross -->
    <path d="M -10 -30 h 20 v 20 h 20 v 20 h -20 v 20 h -20 v -20 h -20 v -20 h 20 z" />
    
    <!-- Central Accent (Teal-like dot) -->
    <circle cx="0" cy="0" r="4" fill="#0d9488" />
  </g>
</svg>
